name: CI

on:
  push:
  pull_request:

jobs:
  lint-syntax-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck systemd
          if ! command -v ydotoold >/dev/null 2>&1; then
            sudo install -Dm755 /bin/true /usr/bin/ydotoold
          fi

      - name: Shell syntax
        run: bash -n bin/hermeskey bin/hermeskey-doctor install.sh uninstall.sh scripts/check.sh scripts/build-release.sh scripts/bootstrap.sh

      - name: Shellcheck
        run: shellcheck bin/hermeskey bin/hermeskey-doctor install.sh uninstall.sh scripts/check.sh scripts/build-release.sh scripts/bootstrap.sh

      - name: Python syntax
        run: python3 -m py_compile bin/hermeskey-server.py bin/hermeskey-overlay.py

      - name: Verify systemd user units
        run: systemd-analyze --user verify systemd/user/hermeskey.service systemd/user/hermeskey-ydotoold.service

      - name: Build release archive
        run: |
          chmod +x scripts/build-release.sh
          ./scripts/build-release.sh

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: hermeskey-release-archive
          path: dist/*.tar.gz
