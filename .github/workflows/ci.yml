name: CI

on:
  push:
  pull_request:

jobs:
  lint-syntax-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck systemd
          if ! command -v ydotoold >/dev/null 2>&1; then
            sudo install -Dm755 /bin/true /usr/bin/ydotoold
          fi

      - name: Checks (shell syntax, shellcheck, Python syntax, systemd units)
        env:
          REQUIRE_SHELLCHECK: "1"
        run: ./scripts/check.sh

      - name: Build release archive
        run: |
          chmod +x scripts/build-release.sh
          ./scripts/build-release.sh

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: hermeskey-release-archive
          path: dist/*.tar.gz
