    <text x="742" y="263" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Transcribing</text>
    <text x="695" y="332" fill="#E2E8F0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">“The message lands exactly where I’m working.”</text>
    <text x="695" y="380" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">• prewarmed Unix-socket STT server</text>
    <text x="695" y="416" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">• click-through, non-focusable overlay</text>
