    <text x="174" y="408" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Recording</text>
    <text x="128" y="463" fill="#CBD5E1" font-family="JetBrains Mono, Consolas, monospace" font-size="22">Press hotkey → speak → press again</text>
    <text x="128" y="499" fill="#64748B" font-family="JetBrains Mono, Consolas, monospace" font-size="18">prewarmed faster-whisper • ydotool typing • soft cues</text>
