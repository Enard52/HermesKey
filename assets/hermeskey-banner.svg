  <text x="265" y="148" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="76" font-weight="800">HermesKey</text>
  <text x="268" y="199" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="500">Push-to-talk speech-to-text for Linux Wayland desktops.</text>
  <text x="94" y="296" fill="#E2E8F0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">One hotkey. Local transcription. Direct typing. No mouse required.</text>

