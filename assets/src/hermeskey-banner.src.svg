  <title id="title">HermesKey: push-to-talk speech-to-text for Linux Wayland desktops</title>
  <rect width="1280" height="400" rx="28" fill="#0f172a"/>

  <!-- Icon (same artwork as assets/hermeskey-icon.svg, on a lighter tile) -->
  <g transform="translate(70,72) scale(0.5)">
    <rect width="512" height="512" rx="112" fill="#1e293b"/>
      <!-- Hermes wing -->
      <path transform="translate(278,150) scale(0.85)" fill="#f59e0b" d="M0 150 C 10 80, 70 20, 170 0 C 186 -3, 196 14, 184 24 C 168 38, 150 46, 128 52 C 150 52, 166 60, 162 74 C 158 86, 140 92, 108 96 C 124 100, 130 112, 122 122 C 108 138, 60 150, 0 150 Z"/>
      <!-- Keycap: side, then top face -->
      <rect x="60" y="128" width="258" height="264" rx="56" fill="#94a3b8"/>
      <rect x="80" y="134" width="218" height="226" rx="42" fill="#f8fafc"/>
