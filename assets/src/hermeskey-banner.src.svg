    <rect x="632" y="292" width="220" height="40" rx="20" fill="#1e293b" stroke="#334155"/>
    <text x="742" y="318">Types into any app</text>
    <rect x="862" y="292" width="240" height="40" rx="20" fill="#1e293b" stroke="#334155"/>
    <text x="982" y="318">KDE Plasma · Wayland</text>
