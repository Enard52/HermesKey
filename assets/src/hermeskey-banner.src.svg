  <text x="380" y="150" font-size="76" font-weight="bold" fill="#f8fafc">Hermes<tspan fill="#f59e0b">Key</tspan></text>
  <text x="382" y="200" font-size="28" fill="#cbd5e1">Push-to-talk speech-to-text for Linux Wayland desktops</text>
  <text x="382" y="248" font-size="22" fill="#94a3b8">Press a key, speak, press again. Your words land where you were typing.</text>

  <g font-size="17" fill="#cbd5e1" text-anchor="middle">
