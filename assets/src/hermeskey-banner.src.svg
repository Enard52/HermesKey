<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" font-family="Cantarell, Inter, 'DejaVu Sans', sans-serif" role="img" aria-labelledby="title">
  <!-- Editable source. assets/hermeskey-banner.svg is generated from this file
